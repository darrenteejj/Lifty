<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lifty</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifty">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120d0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — date header, logged lifts as cards, add-tray of habitual exercises; fixed bottom tabs */
:root{
  --bg:#FBF4EE; --surface:#FFFFFF; --surface-2:#F7EDE4; --line:#EBDCCF; --brand:#EE6F24;
  --ink:#24190F; --muted:#7A6758; --accent:#DC5A14; --accent-soft:#FCE3D2; --accent-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#DDF1E7; --warn:#A86A0C; --warn-soft:#F7ECD8; --bad:#B53A33; --bad-soft:#F7E0DE;
  --g-chest:#D9483B; --g-back:#2F6FD0; --g-shoulders:#8457D3; --g-arms:#D9761A; --g-legs:#1E8C5A; --g-core:#12808C; --g-cardio:#D6457F; --g-other:#6B7684; --g-biceps:#D9761A; --g-triceps:#B8860B; --g-abs:#12808C; --g-hip:#B4436C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g-chest:#F27A6E; --g-back:#6EA0F2; --g-shoulders:#AE8BF0; --g-arms:#F2A35A; --g-legs:#4FC48C; --g-core:#3EBAC6; --g-cardio:#F07AAA; --g-other:#9AA5B2; --g-biceps:#F2A35A; --g-triceps:#E0B44A; --g-abs:#3EBAC6; --g-hip:#EE7FA6;
  --bg:#17110D; --surface:#221A15; --surface-2:#2C221C; --line:#3D3027; --brand:#D9601C;
  --ink:#F4EAE2; --muted:#B5A193; --accent:#FF8C47; --accent-soft:#40220F; --accent-ink:#1C0D04;
  --good:#5CCB95; --good-soft:#173A2A; --warn:#E3A84A; --warn-soft:#3A2D16; --bad:#F08079; --bad-soft:#40201E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --g-chest:#F27A6E; --g-back:#6EA0F2; --g-shoulders:#AE8BF0; --g-arms:#F2A35A; --g-legs:#4FC48C; --g-core:#3EBAC6; --g-cardio:#F07AAA; --g-other:#9AA5B2; --g-biceps:#F2A35A; --g-triceps:#E0B44A; --g-abs:#3EBAC6; --g-hip:#EE7FA6;
  --bg:#17110D; --surface:#221A15; --surface-2:#2C221C; --line:#3D3027; --brand:#D9601C;
  --ink:#F4EAE2; --muted:#B5A193; --accent:#FF8C47; --accent-soft:#40220F; --accent-ink:#1C0D04;
  --good:#5CCB95; --good-soft:#173A2A; --warn:#E3A84A; --warn-soft:#3A2D16; --bad:#F08079; --bad-soft:#40201E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* header */
.scene{position:relative;margin:-8px -16px 16px;container-type:inline-size;background:#1a1512;overflow:hidden;border-radius:0 0 26px 26px}
.scene-img{display:block;width:100%;height:auto}
.scene-status{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.45);font-size:11px}
.board{position:absolute;color:#F6EFE9;display:flex;flex-direction:column;font-family:var(--body);line-height:1.15}
.bl{left:12.3%;top:7.9%;width:35.7%;height:22.5%;padding:2.2cqw 2.4cqw;justify-content:center;gap:1.4cqw}
.br{left:57.2%;top:9.5%;width:36%;height:27.4%;padding:2.2cqw 2.6cqw;gap:1.3cqw;justify-content:center}
.b-title{display:flex;align-items:center;gap:1.4cqw;font-family:var(--display);font-weight:700;font-size:8.2cqw;line-height:.95}
.b-title svg{width:7cqw;height:7cqw;fill:#F08A3C}
.b-sub{font-size:2.9cqw;color:#E9DED6}
.b-week{display:flex;justify-content:space-between;margin-top:.6cqw}
.wd{display:flex;flex-direction:column;align-items:center;gap:.7cqw}
.wd i{font-style:normal;font-size:2.1cqw;color:#BDB1A8;font-weight:600}
.wd b{width:3.7cqw;height:3.7cqw;border-radius:50%;background:#3A3330;display:grid;place-items:center}
.wd.on b{background:#F08A3C}
.wd.today b{box-shadow:0 0 0 .45cqw #F08A3C}
.wd.fut b{opacity:.5}
.wd b svg{width:72%;height:72%;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.b-eyebrow{font-family:var(--display);font-weight:700;font-size:2.9cqw;letter-spacing:.08em;text-transform:uppercase;color:#F08A3C}
.b-row{display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw}
.b-big{font-family:var(--display);font-weight:700;font-size:8.6cqw;line-height:.95;font-variant-numeric:tabular-nums}
.b-lab{font-size:2.15cqw;color:#D9CCC3;line-height:1.15}
.b-bars{display:flex;align-items:flex-end;gap:.8cqw;height:9cqw;width:12cqw;flex:none}
.b-bars span{flex:1;background:#B4622B;border-radius:.5cqw .5cqw 0 0}
.b-bars span.cur{background:#F5913F}
.b-bars span.zero{background:#55504C}
.b-split{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;border-top:1px solid rgba(255,255,255,.18);padding-top:1.6cqw}
.b-split .b-stat+.b-stat{border-left:1px solid rgba(255,255,255,.18);padding-left:1.6cqw}
.b-stat{display:flex;gap:1.1cqw;align-items:flex-start;min-width:0}
.b-stat svg{width:3.6cqw;height:3.6cqw;flex:none;margin-top:.6cqw}
.b-stat svg.ln{fill:none;stroke:#F08A3C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-stat svg.fl{fill:#F08A3C}
.b-num{font-family:var(--display);font-weight:700;font-size:6cqw;line-height:1;font-variant-numeric:tabular-nums}
.stage{margin:-8px -16px 14px;background:#120d0a;display:flex;flex-direction:column;min-height:calc(100svh - 64px - env(safe-area-inset-bottom,0px))}
.stage .scene{margin:0;border-radius:0;flex:none}
.stage::after{content:"";order:1;flex:1;min-height:0;background:linear-gradient(#1d140f,#120d0a)}
.stage .console{order:2}
.boy{position:absolute;inset:0;pointer-events:none;transform-origin:28% 96%}
.boy.backv{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.view-back .boy.backv{opacity:1;visibility:visible;transition:opacity .3s}
.view-back .boy.front{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.boy.front{transition:opacity .3s}
.boy.backv{transform-origin:28% 96%}
.wink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.boy.winking .wink{animation:wink .62s ease-out}
@keyframes wink{0%{opacity:0}12%,68%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.boy.turn{animation:turn .55s cubic-bezier(.3,1.4,.5,1)}}
@keyframes turn{0%{transform:scaleX(.1)}55%{transform:scaleX(1.06)}100%{transform:none}}

.boy img{position:absolute;height:auto;display:block;pointer-events:none;max-width:none}
.parts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.parts .pt{pointer-events:all;cursor:pointer;-webkit-tap-highlight-color:transparent}
.parts path{fill:transparent;stroke:transparent;stroke-width:9;stroke-linejoin:round}
.parts .pt.on path{fill:rgba(255,255,255,.2);stroke:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 10px rgba(255,180,110,.7))}
.plabel{position:absolute;transform:translate(-50%,-50%);background:#1c1512;color:#fff;border:2px solid #fff;border-radius:99px;padding:.5cqw 2.4cqw;font-family:var(--display);font-weight:700;font-size:3.8cqw;letter-spacing:.02em;box-shadow:0 0 10px rgba(255,255,255,.45);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
 .parts .pt.on path{animation:glow 1.6s ease-in-out infinite}
 .boy.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
 .stage.idle:not(.view-back) .curl{animation:curl 2.8s ease-in-out infinite}
 .plabel{animation:pin .35s cubic-bezier(.2,1.5,.4,1)}
}
@keyframes glow{50%{fill:rgba(255,255,255,.07)}}
@keyframes shake{10%{transform:translateX(-1.1cqw) rotate(-1.2deg)}30%{transform:translateX(1cqw) rotate(1deg)}50%{transform:translateX(-.7cqw) rotate(-.6deg)}70%{transform:translateX(.5cqw) rotate(.4deg)}90%{transform:translateX(-.2cqw)}}
@keyframes curl{0%,100%{transform:rotate(0)}38%,52%{transform:rotate(15deg)}82%{transform:rotate(-5deg)}}
@keyframes pin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.console{position:relative;z-index:4;margin-top:-30px;background:linear-gradient(180deg,#2e2621 0%,#1c1612 38%,#110d0a 100%);border-radius:26px 26px 0 0;padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px;color:#F4EAE2;box-shadow:0 -10px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.04)}
.console::before{content:"";position:absolute;left:22px;right:22px;top:0;height:2px;background:linear-gradient(90deg,transparent,#F08A3C,transparent)}
.console::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at 13px 13px,#6d5b4d 0 2.5px,transparent 3.5px),radial-gradient(circle at calc(100% - 13px) 13px,#6d5b4d 0 2.5px,transparent 3.5px)}
.c-top{display:flex;align-items:center;gap:8px;font-size:13px;padding:0 10px}
.c-date{display:flex;align-items:center;background:#0b0907;border:1px solid #33291f;border-radius:99px;padding:1px}
.c-arr{width:30px;height:28px;border:0;border-radius:50%;background:transparent;color:#F4EAE2;font-size:20px;line-height:1}
.c-arr:disabled{opacity:.25}
.c-dl{position:relative;padding:0 4px;font-weight:600;color:#fff}
.c-dl input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.console .status{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:#CDBFB4;margin-left:auto}
.console .status.err{background:#5a1f1a;color:#ffb3ab}
.c-done{border:0;background:rgba(40,160,100,.22);color:#86E3B3;font-weight:600;font-size:12px;border-radius:99px;padding:4px 10px;white-space:nowrap}
.c-parts{display:flex;gap:2px;justify-content:space-between;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:3px 12px 1px}
.c-parts::-webkit-scrollbar{display:none}
.c-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#CDBFB4;font-size:9.5px;letter-spacing:-.1px;font-weight:600;width:38px;min-width:0;padding:0;white-space:nowrap;overflow:visible}
.gi.chip{width:35px;height:35px;border-radius:50%;box-shadow:0 0 0 2px #3a302a}
.c-chip.on{color:#FF9A4D}
.c-chip.on .gi{box-shadow:0 0 0 3px #F08A3C,0 0 12px rgba(240,138,60,.75)}
.c-ex{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;border:1px solid #3a302a;background:#0d0a08;border-radius:14px;padding:5px 10px;text-align:left;color:#F4EAE2}
.c-ex.idle{justify-content:center;color:#a8988b;font-size:14px}
.c-ex .gi.sm{width:34px;height:34px;border-radius:10px}
.c-nm{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.2}
.c-nm small{display:block;font-weight:400;font-size:12px;color:#a8988b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-chg{display:flex;align-items:center;gap:1px;font-size:12px;color:#FF9A4D;font-weight:600;flex:none}
.c-chg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.c-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c-in.one{grid-template-columns:1fr}
.c-box{background:#0d0a08;border:1px solid #3a302a;border-radius:14px;padding:4px 5px 5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.c-lab{font-size:10.5px;color:#a8988b;padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ctl{display:flex;align-items:center;gap:3px}
.c-st{width:34px;height:38px;flex:none;border-radius:10px;border:1px solid #3d332c;background:#241c17;color:#F4EAE2;font-size:20px;line-height:1}
.c-st:active{background:#3d2b1f}
.c-ctl input{flex:1;min-width:0;width:100%;height:38px;border:0;background:transparent;color:#fff;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;padding:0}
.c-ctl input::placeholder{color:#5c4f45}
.c-ctl input:focus{outline:2px solid #F08A3C;border-radius:8px}
.c-add{height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#FF9C47,#E5600E);color:#fff;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #943c07,0 0 18px rgba(240,120,40,.45);transition:transform .08s,box-shadow .08s}
.c-add svg{width:22px;height:22px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round}
.c-add:active{transform:translateY(3px);box-shadow:0 1px 0 #943c07}
.c-add:disabled{opacity:.35;box-shadow:none;filter:grayscale(.6)}
.c-st:disabled,.c-ctl input:disabled{opacity:.35}
.bkp{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bkp h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.bkp p{margin:0;color:var(--muted);font-size:14px}
.bkp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bkp-in{position:relative;display:block}
.bkp-in input{position:absolute;inset:0;opacity:0;width:100%}
.seedask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.sa-card{background:var(--bg);border-radius:22px;padding:20px;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}
.sa-card img{width:72px;height:72px;border-radius:20px;margin:0 auto}
.sa-card h2{margin:0;font-family:var(--display);font-size:26px}
.sa-card p{margin:0;color:var(--muted);font-size:14px}
.pick-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:74vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:540px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.picker{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pk-h{display:flex;align-items:center;gap:10px}
.pk-h h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:28px}
.hero{margin:-8px -16px 16px;padding:14px 16px 18px;background:var(--brand);color:#fff;border-radius:0 0 26px 26px;display:flex;align-items:center;gap:12px}
.avatar{width:58px;height:58px;border-radius:17px;flex:none;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.avatar.sm{width:46px;height:46px;border-radius:14px;box-shadow:none}
.ht{flex:1;min-width:0}
.hname{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.01em}
.hsub{font-size:14px;opacity:.9;margin-top:3px}
.status{font-size:12px;color:#fff;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap}
.status.err{background:#fff;color:var(--bad)}
.empty.coach{flex-direction:row;align-items:center;gap:12px}
.empty.coach .ct{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.datebar{display:flex;align-items:center;gap:6px;padding-block:4px 14px}
.datebar h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.datebar h1 small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.datepick{position:relative}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pagetitle{margin:0;padding-block:4px 14px;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05}

/* entries */
.list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.e-top{display:flex;align-items:center;gap:8px}
.e-name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1}
.pr{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--good);background:var(--good-soft);padding:2px 8px;border-radius:6px}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 4px;border-radius:8px}
.del.arm{color:var(--bad);background:var(--bad-soft);padding:6px 10px;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row .lab{width:54px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ctrl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.step{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1;font-weight:500}
.step:active{background:var(--accent-soft)}
.val{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:2px;height:44px;border-radius:12px;background:var(--surface-2);padding:0 10px;font-family:var(--display);font-weight:600;font-size:26px}
.val input{width:2.2ch;min-width:1.4ch;max-width:6ch;flex:none;border:0;background:transparent;text-align:right;font:inherit;padding:0;height:44px;font-variant-numeric:tabular-nums}
.val input:focus{outline:none}
.val:focus-within{box-shadow:0 0 0 2px var(--accent)}
.val .pairx{color:var(--muted);white-space:nowrap}
.val .unit{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.e-hist{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.e-hist b{font-weight:600;color:var(--ink)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.empty p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:11px 14px;font-weight:600;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}

/* add tray */
.tray{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.tray h2{margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.search{display:flex;gap:8px;align-items:center}

    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await writeKey(k)}catch(e2){failed=true;dirty.add(k)}}
    else{failed=true;if(e&&e.code==='quota_exceeded')setStatus('err','Storage full');else dirty.add(k)}

function busy(k){return dirty.has(k)||inflight.has(k)}
function applySnap(snap){
  const days={};let lib=null;
  for(const doc of snap.docs){const d=doc.data();if(!d)continue;
    if(doc.id==='library')lib=clone(d);
    else if(doc.id.startsWith('d_'))days[doc.id.slice(2)]={entries:clone(d.entries||[])};}
  if(!busy('library'))S.library={exercises:(lib&&lib.exercises)||[]};
  for(const k of Object.keys(S.days))if(busy('d_'+k))days[k]=S.days[k];

function day(date){return S.days[date]||(S.days[date]={entries:[]})}
function addEntry(exId,date){
  const prev=recs(exId,date+'~');const last=prev[prev.length-1];
  const e={id:uid('x'),ex:exId,w:last?last.w:null,reps:last?last.reps:null,done:false};
  const ex=exById(exId);if(ex&&ex.cardio){const le=lastEntry(exId,date+'~');e.mins=le&&le.mins?le.mins:null}
  day(date).entries.push(e);freshId=e.id;markDirty('d_'+date);return e;
}
function newExercise(name,pair,group){
  name=name.trim();if(!name)return null;
  const hit=S.library.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());if(hit)return hit;
  const ex={id:uid('e'),name,pair:!!pair,step:2.5,group:group||'Other'};

  S.library.exercises.push(ex);markDirty('library');return ex;
}

function gymStats(){
  const t=todayStr(),days=dayList().filter(k=>k<=t),set=new Set(days);
  const mk=t.slice(0,7),month=days.filter(k=>k.startsWith(mk)).length;
  const ws=weekStart(t),week=[];for(let i=0;i<7;i++){const d=addDays(ws,i);week.push({d,on:set.has(d),today:d===t,future:d>t})}
  const bars=[];for(let i=5;i>=0;i--){const a=addDays(ws,-7*i),b=addDays(a,7);bars.push(days.filter(k=>k>=a&&k<b).length)}
  const r0=addDays(t,-30),r1=addDays(t,-60),ch=[];
  for(const ex of S.library.exercises){if(ex.cardio)continue;const r=recs(ex.id);
    const now=r.filter(x=>x.date>r0&&x.date<=t),prev=r.filter(x=>x.date>r1&&x.date<=r0);
    if(now.length&&prev.length){const a=Math.max(...now.map(x=>x.e1)),b=Math.max(...prev.map(x=>x.e1));if(b)ch.push((a-b)/b*100)}}
  const pct=ch.length?ch.reduce((a,b)=>a+b,0)/ch.length:null;
  const last=days[days.length-1],since=last?Math.round((toD(t)-toD(last))/864e5):null;
  let streak=0,w=ws;if(!days.some(k=>k>=ws))w=addDays(ws,-7);
  while(days.some(k=>k>=w&&k<addDays(w,7))){streak++;w=addDays(w,-7)}
  return{month,week,bars,pct,nEx:ch.length,since,streak};
}

function consoleUI(){

  const done=(S.days[curDate]?.entries||[]).filter(isDone).length;
  const rel=curDate===t?'Today':curDate===addDays(t,-1)?'Yesterday':fd(curDate,{weekday:'short',day:'numeric',month:'short'});
  let exRow;
  if(!SEL.part)exRow=`<div class="c-ex idle"><span class="c-hint">Tap a body part on Lifty to pick an exercise</span></div>`;
  else if(!ex)exRow=`<button class="c-ex" data-act="pickEx">${gIcon(SEL.part,'sm')}<span class="c-nm">${partExercises(SEL.part).length?'Choose a '+SEL.part.toLowerCase()+' exercise':'Add your first '+SEL.part.toLowerCase()+' exercise'}</span><span class="c-chg">${partExercises(SEL.part).length?'Pick':'+ Add'}</span></button>`;

    exRow=`<button class="c-ex" data-act="pickEx">${gIcon(SEL.part,'sm')}<span class="c-nm">${esc(ex.name)}<small>${le?'Last '+esc(fentry(ex,le))+' · '+esc(short(lastUsedBefore(ex.id))):'First time'}</small></span><span class="c-chg">Change<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></span></button>`}
  const dis=!ex?' disabled':'';
  const box=(k,lab,val,mode)=>`<div class="c-box"><span class="c-lab">${lab}</span><div class="c-ctl"><button class="c-st" data-act="cstep" data-k="${k}" data-d="-1" aria-label="Less"${dis}>−</button><input id="c${k}" inputmode="${mode}" value="${val??''}" placeholder="0" aria-label="${lab}"${dis}><button class="c-st" data-act="cstep" data-k="${k}" data-d="1" aria-label="More"${dis}>+</button></div></div>`;

      <span id="status" class="status${status==='err'?' err':''}">${esc(statusText())}</span>${done?`<button class="c-done" data-act="toDone">${done} done ↓</button>`:''}</div>
    <div class="c-parts">${CHIPS.map(p=>`<button class="c-chip${SEL.part===p?' on':''}" data-act="part" data-p="${p}">${gIcon(p,'chip')}<span>${p}</span></button>`).join('')}</div>
    ${exRow}
    <div class="c-in${cardio?' one':''}">${inputs}</div>
    <button class="c-add" data-act="addSet"${dis}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add set</button>
  </div>`;
}

function addSet(btn){

}

function header(){const mk=todayStr().slice(0,7),n=dayList().filter(k=>k.startsWith(mk)).length;
  const sub=n?`${n} session${n>1?'s':''} this month`:`Let's get a session in`;
  return `<header class="hero"><img class="avatar" src="${MASCOT}" alt="Lifty mascot flexing a dumbbell"><div class="ht"><div class="hname">Lifty</div><div class="hsub">${esc(sub)}</div></div><span id="status" class="status${status==='err'?' err':''}">${esc(statusText())}</span></header>`}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));
  const html=view==='log'?renderLog():view==='progress'?renderProgress():renderHistory();
  app.innerHTML='<div class="wrap">'+(view==='log'?stage():header())+html+'</div>'+(view==='log'?pickerUI():'');
  if(shakeOnRender){shakeOnRender=false;setTimeout(()=>document.querySelectorAll('.boy.winking').forEach(b=>b.classList.remove('winking')),700)}
  if(view==='log'&&shownView!==wantView){const st=document.getElementById('stage');shownView=wantView;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!st)return;st.classList.toggle('view-back',wantView==='back');const b=document.getElementById(wantView==='back'?'boyB':'boyF');if(b){b.classList.add('turn');setTimeout(()=>b.classList.remove('turn'),600)}}))}
  if(view==='log')poke();
  if(openEx)renderSheet();
  app.querySelectorAll('.val input').forEach(sizeIn);
  if(justDone){const el=app.querySelector('.drow.pop');justDone=null;if(el&&!quietDone){el.scrollIntoView({block:'nearest'});burst(el)}quietDone=false}
  if(freshId){const el=app.querySelector(`[data-id="${freshId}"] .w-in`);freshId=null;if(el){el.focus();el.select()}}
}

function renderLog(){
  const t=todayStr(),rel=curDate===t?'Today':curDate===addDays(t,-1)?'Yesterday':fd(curDate,{year:'numeric'});
  const d=S.days[curDate],entries=d?d.entries:[];
  let h='';
  if(status==='loading'&&!dayList().length&&!S.library.exercises.length){
    h+=`<div class="empty"><p>Loading your training log…</p></div>`;return h;
  }
  if(!entries.length){
    const prev=dayList().filter(k=>k<curDate).pop();
    h+=`<div class="empty coach"><div class="ct"><p>Nothing logged for this day yet. Tap a body part on Lifty to add your first set.</p>`+
      (prev?`<button class="btn ghost" data-act="repeat" data-d="${prev}">Repeat ${esc(fd(prev,{weekday:'short',day:'numeric',month:'short'}))} · ${S.days[prev].entries.length} exercises</button>`:'')+`</div></div>`;
  }else{
    const open=entries.filter(e=>!isDone(e)),done=entries.filter(isDone);
    if(open.length)h+='<div class="list">'+open.map(entryCard).join('')+'</div>';
    if(done.length)h+=doneList(done);
  }
  return h;
}
let justDone=null,quietDone=false,actx=null;
function sizeIn(i){if(!i)return;const v=i.value||i.placeholder||'0';let w=0;for(const ch of v)w+=(ch==='.'||ch===',')?0.42:1;i.style.width=(w+0.25)+'ch'}
function chime(pr){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const notes=pr?[523.25,659.25,783.99,1046.5]:[659.25,987.77],t0=actx.currentTime;
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=t0+i*0.09;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.45)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(pr?[20,40,30]:25)}catch(e){}}
function toast(html){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML=html;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function burst(el){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=el.getBoundingClientRect(),cols=['#EE6F24','#F5B53F','#1E8C5A','#2F6FD0','#D6457F'];
  for(let i=0;i<16;i++){const d=document.createElement('i');d.className='confetti';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';d.style.background=cols[i%5];
    const a=Math.PI*2*i/16,dist=50+Math.random()*50;d.style.setProperty('--dx',Math.cos(a)*dist+'px');d.style.setProperty('--dy',Math.sin(a)*dist-30+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),800)}}
function isDone(e){return e.done!==false}
function isPR(e){const ex=exById(e.ex);if(!ex||ex.cardio||e.w==null||!e.w)return false;const r=recs(e.ex,curDate);if(!r.length)return false;return e1(ex,e.w,e.reps)>Math.max(...r.map(x=>x.e1))+1e-9}
function doneList(done){
  const lbl=curDate===todayStr()?'Done today':'Done';

function entryCard(e){

      <button class="step" data-act="stepW" data-d="1" aria-label="More weight">+</button></div></div>

function doneBtn(){return `<button class="donebtn" data-act="done"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></svg>Done</button>`}
function histLine(e){

}
function refreshEntry(el,e){

  const px=el.querySelector('.pairx');if(px)px.textContent=ex&&ex.pair?'+'+(nf(e.w)||'0'):'';

const GROUPS=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Hip','Abs','Cardio'];
let addGroup=null;
function grpOf(e){let g=e.group||(e.cardio?'Cardio':'Other');if(g==='Arms')g=/tricep/i.test(e.name||'')?'Triceps':'Biceps';if(g==='Core')g='Abs';if(g==='Legs'&&/hip|glute/i.test(e.name||''))g='Hip';return g}
function lastUsed(){const m={};for(const k of dayList())for(const e of S.days[k].entries)m[e.ex]=k;return m}
function renderChips(){
  const box=document.getElementById('tray');if(!box)return;

    return;
  }
  const g=addGroup,lu=lastUsed(),inDay=new Set((S.days[curDate]?.entries||[]).map(e=>e.ex));
  const list=exs.filter(e=>grpOf(e)===g).sort((a,b)=>(lu[b.id]||'').localeCompare(lu[a.id]||'')||a.name.localeCompare(b.name));
  let h=`<div class="ghead"><button class="iconbtn" data-act="grpBack" aria-label="Back to body parts"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>${gIcon(g)}<h2>${g}</h2></div><div class="exlist">`;
  h+=list.map(e=>{let sub='Not logged yet';
    if(e.cardio){const le=lastEntry(e.id,'9999');if(le&&le.mins)sub='Last '+le.mins+' min · '+short(lu[e.id])}
    else{const r=recs(e.id);const l=r[r.length-1];if(l)sub='Last '+fset(e,l.w,l.reps)+' · '+short(l.date)}

    (g==='Cardio'?'':`<label class="pairtog"><input type="checkbox" id="exPair" checked> L+R</label>`)+`<button class="btn" data-act="newEx">Add</button></div>`;
  box.innerHTML=h;
}

function spark(r){
  if(r.length<2)return '<svg class="spark" viewBox="0 0 84 30"></svg>';
  const v=r.map(x=>x.e1),mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=v.map((y,i)=>[2+i*(80/(v.length-1)),26-(y-mn)/rg*22]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 84 30" aria-hidden="true"><path d="${d} L${l[0].toFixed(1)} 30 L2 30 Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}
function renderProgress(){
  const rows=S.library.exercises.map(ex=>{const r=recs(ex.id);return{ex,r,t:trend(r),last:r[r.length-1]}}).filter(x=>x.r.length);
  if(!rows.length)return `<h1 class="pagetitle">Progress</h1><div class="empty"><p>Log a few sessions and each exercise will show its trend here.</p></div>`;
  rows.sort((a,b)=>b.last.date.localeCompare(a.last.date));
  const c={up:0,flat:0,down:0};rows.forEach(x=>{if(c[x.t.k]!=null)c[x.t.k]++});
  const judged=c.up+c.flat+c.down;
  let verdict=judged?`${c.up} of ${judged} exercises are above your earlier best. `+(c.down?`${c.down} ${c.down>1?'have':'has'} slipped — tap to see where.`:'Nothing has slipped.'):'Log each exercise at least twice to see a trend.';
  let h=`<h1 class="pagetitle">Progress</h1>
   <div class="summary"><div class="sum up"><div class="k num">${c.up}</div><div class="l">Improving</div></div><div class="sum"><div class="k num">${c.flat}</div><div class="l">Holding</div></div><div class="sum down"><div class="k num">${c.down}</div><div class="l">Dropping</div></div></div>
   <p class="verdict">${esc(verdict)}</p><div class="list">`;
  h+=rows.map(x=>`<button class="prow" data-act="openEx" data-ex="${x.ex.id}"><span style="min-width:0"><div class="nm">${esc(x.ex.name)}</div><div class="sb num">${esc(fset(x.ex,x.last.w,x.last.reps))} · ${esc(short(x.last.date))}</div></span>${spark(x.r)}<span class="tag ${x.t.k}">${esc(x.t.label)}</span></button>`).join('');
  return h+`</div><p class="hint" style="margin-top:12px">Trend compares your recent sessions with your best before them, using estimated 1-rep max so heavier weight and extra reps both count.</p>`;
}

function renderHistory(){
  const ks=dayList().reverse();
  if(!ks.length)return `<h1 class="pagetitle">History</h1><div class="empty"><p>Your sessions will be listed here by date.</p></div>`;
  const months={};for(const k of ks){const mm=k.slice(0,7);(months[mm]=months[mm]||{days:0,g:{}});months[mm].days++;for(const [g] of dayGroups(k))months[mm].g[g]=(months[mm].g[g]||0)+1}
  let h=`<h1 class="pagetitle">History</h1><p class="verdict">${ks.length} sessions since ${esc(fd(ks[ks.length-1],{day:'numeric',month:'short',year:'numeric'}))}</p>`,m='';
  for(const k of ks){
    const mk=k.slice(0,7);
    if(mk!==m){if(m)h+='</div>';const M=months[mk];
      h+=`<div class="month"><span>${esc(fd(k,{month:'long',year:'numeric'}))}</span><span class="mstat">${Object.entries(M.g).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<span class="mchip">${gIcon(g,'sm')}<span class="num">${n}</span></span>`).join('')}</span></div><div class="list">`;m=mk}
    const gs=dayGroups(k);
    h+=`<button class="hday" data-act="goto" data-d="${k}"><span class="d num">${toD(k).getDate()}<small>${esc(fd(k,{weekday:'short'}))}</small></span><span class="hbody">`+
      gs.map(([g,es])=>`<span class="hgrp" style="--gc:var(--g-${(GICON[g]?g:'Other').toLowerCase()})"><span class="hgh">${gIcon(g)}<span>${g}</span></span><span class="hlist">`+
        es.map(e=>{const ex=exById(e.ex);return `<span class="hrow"><span class="hn">${esc(ex?ex.name:'Unknown')}</span><span class="hv num">${fval(ex,e)}</span></span>`+(e.note?`<span class="hnote">${esc(e.note)}</span>`:'')}).join('')+`</span></span>`).join('')+
      `</span></button>`;
  }
  return h+'</div>'+backupBox();
}
function backupBox(){return `<section class="bkp"><h2>Backup</h2><p>Save a copy of your whole log to Files, iCloud or email. Do it every few weeks; your log lives only on this phone.</p>
  <div class="bkp-row"><button class="btn" data-act="bkJson">Back up log</button><button class="btn ghost" data-act="bkCsv">Export spreadsheet</button></div>
  <label class="btn ghost bkp-in">Restore from backup<input type="file" id="restoreIn" accept=".json,application/json"></label>
  <p class="hint" id="bkMsg"></p></section>`}
function bkFile(name,text,type){const f=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function bkJson(){bkFile('Lifty-backup-'+todayStr()+'.json',JSON.stringify({app:'Lifty',version:1,exported:new Date().toISOString(),data:S},null,1),'application/json')}
function bkCsv(){const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Date','Body part','Exercise','Weight per side (kg)','Same both sides','Reps','Minutes','Note']];
  for(const k of dayList())for(const e of S.days[k].entries){const ex=exById(e.ex)||{};rows.push([k,grpOf(ex),ex.name||'',e.w,ex.pair?'yes':'no',e.reps,e.mins,e.note||''])}
  bkFile('Lifty-log-'+todayStr()+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function restore(file){const r=new FileReader();r.onload=()=>{const m=document.getElementById('bkMsg');try{const j=JSON.parse(r.result),d=j.data||j;
    if(!d.library||!d.days)throw 0;
    const ids=new Set(S.library.exercises.map(e=>e.id));for(const e of d.library.exercises||[])if(!ids.has(e.id))S.library.exercises.push(e);
    let n=0;for(const k of Object.keys(d.days)){const cur=day(k),have=new Set(cur.entries.map(e=>e.id));for(const e of d.days[k].entries||[])if(!have.has(e.id)){cur.entries.push(e);n++}}
    saveCache();render();toast(`<span><b>Restored</b>${n} set${n===1?'':'s'} added from backup</span>`)}
  catch(e){if(m)m.textContent='That file isn\'t a Lifty backup. Pick the .json file from "Back up log".'}};r.readAsText(file)}

function niceTicks(mn,mx){if(mn===mx){mn-=1;mx+=1}const raw=(mx-mn)/3,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<1.5?1:f<3?2:f<7?5:10)*p;const lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st,t=[];for(let v=lo;v<=hi+1e-9;v+=st)t.push(+v.toFixed(4));return t}
function chart(ex,r){
  const W=340,H=190,L=38,R=14,T=18,B=26;
  const ws=r.map(x=>x.w<=0?0:x.w),ticks=niceTicks(Math.min(...ws),Math.max(...ws)),y0=ticks[0],y1=ticks[ticks.length-1];
  const t0=toD(r[0].date).getTime(),t1=toD(r[r.length-1].date).getTime(),span=t1-t0||1;
  const X=d=>r.length===1?(L+W-R)/2:L+(toD(d).getTime()-t0)/span*(W-L-R);
  const Y=v=>T+(1-(v-y0)/((y1-y0)||1))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.name)} weight over time">`;
  for(const t of ticks)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(t)}</text>`;
  const pts=r.map(x=>[X(x.date),Y(x.w<=0?0:x.w)]);
  if(pts.length>1){const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    s+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z" fill="var(--accent-soft)" opacity=".7"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`}
  const showReps=r.length<=14;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`;
    if(showReps&&r[i].reps)s+=`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">×${r[i].reps}</text>`});
  s+=`<text x="${L}" y="${H-7}" font-size="11" fill="var(--muted)">${esc(short(r[0].date))}</text>`;
  if(r.length>1)s+=`<text x="${W-R}" y="${H-7}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(short(r[r.length-1].date))}</text>`;
  return s+'</svg>';
}
function renderSheet(){
  const ex=exById(openEx);if(!ex){closeSheet();return}
  const r=recs(ex.id),t=trend(r);
  let h=`<div class="wrap"><div class="sh-top"><button class="iconbtn" data-act="closeSheet" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input class="sh-name" id="exname" value="${esc(ex.name)}" aria-label="Exercise name"></div>
    <div class="settings"><label><input type="checkbox" id="expair" ${ex.pair?'checked':''}> Same weight left + right</label>
    <label>Body part <select id="exgroup">${GROUPS.concat(['Other']).map(g=>`<option ${grpOf(ex)===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label><input type="checkbox" id="excardio" ${ex.cardio?'checked':''}> Timed (minutes)</label>
    <label>Step <select id="exstep">${[0.5,1,2,2.5,5,10].map(v=>`<option value="${v}" ${(ex.step||1)==v?'selected':''}>${v} kg</option>`).join('')}</select></label></div>`;
  if(r.length){
    const best=r.reduce((a,b)=>b.e1>a.e1?b:a),last=r[r.length-1],first=r[0];
    const since=first.e1?((last.e1-first.e1)/first.e1*100):0;
    h+=`<div class="stats"><div class="stat"><div class="l">Best</div><div class="v num">${esc(fset(ex,best.w,best.reps))}</div><div class="s">${esc(short(best.date))}</div></div>
      <div class="stat"><div class="l">Latest</div><div class="v num">${esc(fset(ex,last.w,last.reps))}</div><div class="s">${esc(short(last.date))}</div></div>
      <div class="stat"><div class="l">Trend</div><div class="v"><span class="tag ${t.k}">${esc(t.label)}</span></div><div class="s num">${r.length>1?(since>=0?'+':'')+since.toFixed(0)+'% since first':'—'}</div></div></div>
      <div class="chart"><div class="cap">Top set weight${ex.pair?' per side':''} (kg), reps above each point</div>${chart(ex,r)}</div>
      <div style="overflow-x:auto"><table class="recs"><thead><tr><th>Date</th><th>Weight</th><th>Reps</th><th>Est. 1RM</th></tr></thead><tbody>`+
      r.slice().reverse().map(x=>`<tr data-act="goto" data-d="${x.date}"><td>${esc(fd(x.date,{day:'numeric',month:'short',year:'2-digit'}))}</td><td>${esc(fw(ex,x.w))}</td><td>${x.reps??'—'}</td><td>${load(ex,x.w)?nf(Math.round(x.e1))+' kg':'—'}</td></tr>`).join('')+`</tbody></table></div>`;
  }else h+=`<div class="empty"><p>No sets logged for this exercise yet.</p></div>`;
  h+=`<button class="danger" data-act="delEx">Delete exercise${r.length?' and its '+r.length+' records':''}</button></div>`;
  sheet.innerHTML=h;sheet.hidden=false;
}
function closeSheet(){openEx=null;sheet.hidden=true;sheet.innerHTML='';render()}

/* ---------- events ---------- */
function findEntry(el){const c=el.closest('.entry');if(!c)return[];const e=(S.days[curDate]?.entries||[]).find(x=>x.id===c.dataset.id);return[c,e]}
function onClick(ev){
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tab'){view=b.dataset.v;if(openEx){openEx=null;sheet.hidden=true}render();window.scrollTo(0,0);return}
  if(a==='prev'){curDate=addDays(curDate,-1);render();return}
  if(a==='next'){if(curDate<todayStr()){curDate=addDays(curDate,1);render()}return}
  if(a==='goto'){curDate=b.dataset.d;view='log';openEx=null;sheet.hidden=true;render();window.scrollTo(0,0);return}
  if(a==='add'){if(b.classList.contains('added')){const el=app.querySelector('.entry .e-name[data-ex="'+b.dataset.ex+'"]');if(el)el.scrollIntoView({block:'center'});return}addEntry(b.dataset.ex,curDate);render();return}
  if(a==='grp'){addGroup=b.dataset.g;renderChips();document.getElementById('tray').scrollIntoView({block:'start'});return}
  if(a==='grpBack'){addGroup=null;renderChips();return}
  if(a==='newEx'){createFromQuery();return}
  if(a==='repeat'){for(const e of S.days[b.dataset.d].entries){day(curDate).entries.push({id:uid('x'),ex:e.ex,w:e.w,reps:e.reps,mins:e.mins??null,done:false})}markDirty('d_'+curDate);render();return}
  if(a==='openEx'){openEx=b.dataset.ex;renderSheet();sheet.scrollTop=0;return}
  if(a==='closeSheet'){closeSheet();return}
  if(a==='stepW'||a==='stepR'){const[c,e]=findEntry(b);if(!e)return;const ex=exById(e.ex);const d=+b.dataset.d;
    if(a==='stepW'){e.w=Math.max(0,Math.round(((e.w||0)+d*(ex?.step||1))*100)/100);c.querySelector('.w-in').value=nf(e.w)}
    else{e.reps=Math.max(0,(e.reps||0)+d);c.querySelector('.r-in').value=e.reps}
    refreshEntry(c,e);markDirty('d_'+curDate);return}
  if(a==='stepM'){const[c,e]=findEntry(b);if(!e)return;e.mins=Math.max(0,(e.mins||0)+(+b.dataset.d));c.querySelector('.m-in').value=e.mins;sizeIn(c.querySelector('.m-in'));markDirty('d_'+curDate);return}
  if(a==='part'){const pp=b.dataset.p;boop(pp);if(SEL.part===pp){shakeOnRender=true;render();return}SEL.ex=null;choosePart(pp);return}
  if(a==='pickEx'){SEL.picking=true;render();return}
  if(a==='closePick'){SEL.picking=false;render();return}
  if(a==='pickOne'){loadDefaults(b.dataset.ex);SEL.picking=false;render();return}
  if(a==='newPick'){const q=document.getElementById('newname'),pc=document.getElementById('exPair');if(!q||!q.value.trim()){if(q)q.focus();return}
    const ex=newExercise(q.value,pc?pc.checked:false,SEL.part);loadDefaults(ex.id);SEL.picking=false;render();return}
  if(a==='cstep'){const k=b.dataset.k,d=+b.dataset.d,ex=exById(SEL.ex);
    if(k==='w')SEL.w=Math.max(0,Math.round(((SEL.w||0)+d*(ex?.step||2.5))*100)/100);else if(k==='r')SEL.reps=Math.max(0,(SEL.reps||0)+d);else SEL.mins=Math.max(0,(SEL.mins||0)+d*5);
    const i=document.getElementById('c'+k);if(i)i.value=k==='w'?nf(SEL.w):(k==='r'?SEL.reps:SEL.mins);return}
  if(a==='addSet'){addSet(b);return}
  if(a==='bkJson'){bkJson();return}
  if(a==='bkCsv'){bkCsv();return}
  if(a==='toDone'){const el=app.querySelector('.donebox');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='done'){const[c,e]=findEntry(b);if(!e)return;const ex=exById(e.ex);
    const ok=ex&&ex.cardio?e.mins>0:(e.w!=null&&e.w!==''&&e.reps>0);
    if(!ok){const f=c.querySelector(ex&&ex.cardio?'.m-in':(e.w==null?'.w-in':'.r-in'));toast(ex&&ex.cardio?'Enter the minutes first':(e.w==null?'Enter the weight first':'Enter the reps first'));if(f)f.focus();return}
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    const pr=isPR(e);e.done=true;justDone=e.id;markDirty('d_'+curDate);chime(pr);
    toast(`<img src="${MASCOT}" alt=""><span><b>${pr?'New best!':'Nice set!'}</b>${esc(ex.name)} · ${esc(fentry(ex,e))}</span>`);
    c.classList.add('leaving');setTimeout(render,matchMedia('(prefers-reduced-motion: reduce)').matches?0:220);return}
  if(a==='reopen'){const e=(S.days[curDate]?.entries||[]).find(x=>x.id===b.dataset.id);if(!e)return;e.done=false;markDirty('d_'+curDate);render();
    const el=app.querySelector(`[data-id="${e.id}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(a==='del'){const[c,e]=findEntry(b);if(!e)return;
    if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Tap to remove';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='Remove'}},3000);return}
    const d=S.days[curDate];d.entries=d.entries.filter(x=>x!==e);markDirty('d_'+curDate);render();return}
  if(a==='delEx'){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Tap again to delete for good';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='Delete exercise'}},3500);return}
    const id=openEx;S.library.exercises=S.library.exercises.filter(x=>x.id!==id);markDirty('library');
    for(const k of Object.keys(S.days)){const d=S.days[k];const n=d.entries.length;d.entries=d.entries.filter(x=>x.ex!==id);if(d.entries.length!==n)markDirty('d_'+k)}
    closeSheet();return}
}
function createFromQuery(){const q=document.getElementById('newname'),p=document.getElementById('exPair');if(!q||!q.value.trim()){if(q)q.focus();return}
  const ex=newExercise(q.value,p?p.checked:false,addGroup);q.value='';addEntry(ex.id,curDate);render()}
document.addEventListener('click',onClick);
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='cw'){const v=t.value.replace(',','.').trim();SEL.w=v===''||isNaN(+v)?null:+v;return}
  if(t.id==='cr'){const v=parseInt(t.value);SEL.reps=isNaN(v)?null:v;return}
  if(t.id==='cm'){const v=parseInt(t.value);SEL.mins=isNaN(v)?null:v;return}
  if(t.classList.contains('w-in')||t.classList.contains('r-in')){const[c,e]=findEntry(t);if(!e)return;
    const v=t.value.replace(',','.').trim();
    if(t.classList.contains('w-in'))e.w=v===''||isNaN(+v)?null:+v;else e.reps=v===''||isNaN(parseInt(v))?null:parseInt(v);
    refreshEntry(c,e);markDirty('d_'+curDate);return}
  if(t.classList.contains('m-in')){sizeIn(t);const[c,e]=findEntry(t);if(!e)return;const v=parseInt(t.value);e.mins=isNaN(v)?null:v;markDirty('d_'+curDate);return}
  if(t.classList.contains('note-in')){const[c,e]=findEntry(t);if(!e)return;const v=t.value.trim();if(v)e.note=t.value;else delete e.note;markDirty('d_'+curDate);return}
  if(t.id==='exname'){const ex=exById(openEx);if(ex&&t.value.trim()){ex.name=t.value.trim();markDirty('library')}return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='restoreIn'&&t.files&&t.files[0]){restore(t.files[0]);t.value='';return}
  if(t.id==='datein'&&t.value){curDate=t.value>todayStr()?todayStr():t.value;render();return}
  if(t.id==='expair'){const ex=exById(openEx);if(ex){ex.pair=t.checked;markDirty('library');renderSheet()}return}
  if(t.id==='exgroup'){const ex=exById(openEx);if(ex){ex.group=t.value;markDirty('library')}return}
  if(t.id==='excardio'){const ex=exById(openEx);if(ex){ex.cardio=t.checked;markDirty('library');renderSheet()}return}
  if(t.id==='exstep'){const ex=exById(openEx);if(ex){ex.step=+t.value;markDirty('library')}return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newname'){ev.preventDefault();const nb=document.querySelector('[data-act="newPick"]');if(nb)nb.click();else createFromQuery()}});
document.addEventListener('focusin',ev=>{if(ev.target.classList&&(ev.target.classList.contains('w-in')||ev.target.classList.contains('r-in')))setTimeout(()=>{try{ev.target.select()}catch(e){}},0)});

/* ---------- boot ---------- */
loadCache();
function hasSeed(){for(const k in S.days)for(const e of S.days[k].entries)if(SEED_E.has(e.id))return true;return false}
function seedAsk(){let ch=null;try{ch=localStorage.getItem('lifty-seed-choice')}catch(e){}
  if(ch||!hasSeed())return;
  const d=document.createElement('div');d.className='seedask';d.innerHTML=`<div class="sa-card" role="dialog" aria-label="Start your log"><img src="${MASCOT}" alt=""><h2>Is this your log?</h2><p>This phone has a training log that came with an earlier version of Lifty. If it isn't yours, start fresh and Lifty will clear it. Anything you've added yourself stays.</p><button class="btn" data-sa="fresh">Start my own log</button><button class="btn ghost" data-sa="keep">It's mine, keep it</button></div>`;
  d.addEventListener('click',ev=>{const b=ev.target.closest('[data-sa]');if(!b)return;
    if(b.dataset.sa==='fresh'){for(const k of Object.keys(S.days)){S.days[k].entries=S.days[k].entries.filter(e=>!SEED_E.has(e.id));if(!S.days[k].entries.length)delete S.days[k]}
      const used=new Set();for(const k in S.days)for(const e of S.days[k].entries)used.add(e.ex);
      S.library.exercises=S.library.exercises.filter(x=>!SEED_X.has(x.id)||used.has(x.id));saveCache();render()}
    try{localStorage.setItem('lifty-seed-choice',b.dataset.sa)}catch(e){}d.remove()});
  document.body.appendChild(d)}
setTimeout(seedAsk,300);
render();
(async()=>{
  try{
    let c=window.claude;for(let i=0;!c&&i<0;i++){await new Promise(r=>setTimeout(r,100));c=window.claude}
    if(!c||!c.use)throw 0;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    col=db.collection('data/users/'+id);mode='db';
    col.onSnapshot(applySnap,()=>setStatus('err','Sync paused — reopen to reconnect'));
    if(dirty.size)flush();
  }catch(e){mode='local';setStatus('local');if(dirty.size)flush();schedRender()}
})();
})();
</script>
